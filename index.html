<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sort ShipStation pull-list SKUs locally in your browser." />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Pull List Sorter</title>
  </head>
  <body>
    <div id="app">
      <header class="site-header">
        <a class="brand" href="/" aria-label="Pull List Sorter home">
          <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <strong>Pull List Sorter</strong>
        </a>
        <div class="local-status" title="PDFs are processed only inside this browser">
          <span aria-hidden="true"></span>
          Local only
        </div>
      </header>

      <main>
        <section class="tool-shell" aria-label="Pull list sorter">
          <div
            id="drop-zone"
            class="drop-zone"
            role="button"
            tabindex="0"
            aria-controls="pdf-input"
            aria-describedby="drop-help"
          >
            <input id="pdf-input" type="file" accept="application/pdf,.pdf" hidden />
            <div class="drop-icon" aria-hidden="true">
              <svg viewBox="0 0 32 38"><path d="M6 1h13l7 7v29H6zM19 1v8h7" /><text x="16" y="27">PDF</text></svg>
            </div>
            <h1>Drop PDF</h1>
            <span class="drop-action">Browse</span>
            <p id="drop-help">ShipStation Product Pick List</p>
          </div>

          <div id="progress-panel" class="progress-panel" hidden>
            <div class="progress-heading">
              <div>
                <p class="status-label">PROCESSING</p>
                <h2 id="progress-title">Reading PDF…</h2>
              </div>
              <span id="progress-percent">0%</span>
            </div>
            <div class="progress-track" aria-hidden="true"><div id="progress-bar"></div></div>
            <p id="progress-detail" class="progress-detail" role="status" aria-live="polite"></p>
          </div>

          <div id="error-panel" class="notice notice-error" role="alert" hidden>
            <div class="notice-icon" aria-hidden="true">!</div>
            <div>
              <h2>Can’t read PDF</h2>
              <p id="error-message"></p>
            </div>
            <button id="error-reset" class="text-button" type="button">Choose another</button>
          </div>

          <section id="results-panel" class="results-panel" aria-labelledby="results-title" hidden>
            <div class="results-header">
              <div>
                <p class="status-label status-label-success">READY</p>
                <h2 id="results-title"><span id="result-count">0</span> items</h2>
                <p id="result-file" class="result-file"></p>
              </div>
              <button id="reset-button" class="secondary-button" type="button">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 4v6h6M20 20v-6h-6M5.6 15a7 7 0 0 0 11.8 2M18.4 9A7 7 0 0 0 6.6 7" /></svg>
                New PDF
              </button>
            </div>

            <div id="warnings" class="notice notice-warning" hidden>
              <div class="notice-icon" aria-hidden="true">i</div>
              <div><h3>Review OCR items</h3><ul id="warning-list"></ul></div>
            </div>

            <div class="action-bar" aria-label="Export actions">
              <div class="action-count"><strong id="action-count">0</strong><span>unique SKUs</span></div>
              <div class="action-buttons">
                <button id="copy-button" class="primary-button" type="button">
                  <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M9 8h10v12H9zM5 16H4V4h10v1" /></svg>
                  <span>Copy</span>
                </button>
                <button id="download-button" class="secondary-button" type="button">
                  <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14" /></svg>
                  CSV
                </button>
                <button id="print-button" class="secondary-button" type="button">
                  <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M7 9V4h10v5M7 17H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2M7 14h10v6H7z" /></svg>
                  Print
                </button>
              </div>
            </div>

            <div class="sku-card">
              <div class="sku-table-head" aria-hidden="true"><span>#</span><span>Item #</span><span>Source</span><span></span></div>
              <ol id="sku-list" class="sku-list"></ol>
              <form id="add-form" class="add-form">
                <label for="new-sku">Add item</label>
                <div>
                  <input id="new-sku" name="sku" autocomplete="off" placeholder="BES-220" maxlength="9" />
                  <button type="submit">Add</button>
                </div>
                <p id="add-error" class="field-error" role="alert"></p>
              </form>
            </div>
          </section>
        </section>
      </main>

      <div id="print-view" aria-hidden="true">
        <header><h1>Pull List Sorter</h1><p id="print-meta"></p></header>
        <ol id="print-list"></ol>
      </div>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
